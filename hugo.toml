baseURL = "https://mistysun19.github.io/"
languageCode = "en-us"
title = "Jingsong Sun"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# Pretty URLs and emoji support
pygmentsUseClasses = true
enableEmoji = true

[minify]
  disableXML = true
  minifyOutput = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  title = "Jingsong Sun"
  description = "Personal homepage of Jingsong Sun: post-training and evaluation for language model agents."
  keywords = ["Jingsong Sun", "LLM agents", "post-training", "language model evaluation"]
  author = "Jingsong Sun"
  defaultTheme = "auto"           # auto / light / dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.assets]
    disableHLJS = false
    disableFingerprinting = false
    favicon = "/favicon.ico"

  [params.label]
    text = "Jingsong Sun"
    icon = ""
    iconHeight = 35

  # Profile-mode home page (PaperMod)
  [params.profileMode]
    enabled = true
    title = "Hi, I'm Misty Sun 👋"
    subtitle = "孙靖淞 · CS @ Xi'an Jiaotong University.<br/>Interested in <strong>LLM agents</strong>."
    imageUrl = "/avatar.jpg"
    imageWidth = 180
    imageHeight = 180
    imageTitle = "Misty Sun (painting by herself)"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "posts"

    [[params.profileMode.buttons]]
      name = "About"
      url = "about"

    [[params.profileMode.buttons]]
      name = "CV (PDF)"
      url = "/Jingsong-Sun-Resume.pdf"

    [[params.profileMode.buttons]]
      name = "Projects"
      url = "projects"

  # Social icons under the profile
  [[params.socialIcons]]
    name = "email"
    title = "Email (Berkeley)"
    url = "mailto:jingsongsun@berkeley.edu"

  [[params.socialIcons]]
    name = "email"
    title = "Email (XJTU)"
    url = "mailto:jingsongsun@stu.xjtu.edu.cn"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/Mistysun19"

  [[params.socialIcons]]
    name = "cv"
    title = "CV"
    url = "/Jingsong-Sun-Resume.pdf"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON output is needed for the search page

[markup]
  [markup.goldmark.renderer]
    unsafe = true                  # allow raw HTML in markdown (for KaTeX etc.)
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
